name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e . pytest
      - name: Test (the core needs no NPU or camera)
        run: python -m pytest -q
